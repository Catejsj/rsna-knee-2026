<svg xmlns='http://www.w3.org/2000/svg' width='960' height='340' viewBox='0 0 960 340' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'><rect width='960' height='340' rx='12' fill='#fcfcfb'/><text x='32' y='34' font-size='17' fill='#0b0b0b' text-anchor='start' font-weight='600' >Our pipeline (public 0.910 / private 0.891)</text><rect x='32' y='62' width='200' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='32' y='62' width='4' height='110' rx='2' fill='#52514e'/><text x='48' y='86' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >MRI study (DICOM)</text><text x='48' y='106' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >3 planes, 1 series each</text><text x='48' y='123' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >sagittal / coronal / axial</text><rect x='262' y='62' width='210' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='262' y='62' width='4' height='110' rx='2' fill='#2a78d6'/><text x='278' y='86' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >Geometry normalisation</text><text x='278' y='106' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >sort slices by position</text><text x='278' y='123' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >crop 160 mm of anatomy</text><text x='278' y='140' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >flip every knee one way</text><rect x='502' y='62' width='200' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='502' y='62' width='4' height='110' rx='2' fill='#2a78d6'/><text x='518' y='86' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >Encoder per slice</text><text x='518' y='106' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >12 slices x 3 planes, 224px</text><text x='518' y='123' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >DINOv2 or RadImageNet</text><text x='518' y='140' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >ResNet-50, fine-tuned</text><rect x='732' y='62' width='196' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='732' y='62' width='4' height='110' rx='2' fill='#2a78d6'/><text x='748' y='86' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >Per-finding attention</text><text x='748' y='106' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >each of 12 findings picks</text><text x='748' y='123' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >its own slices</text><text x='748' y='140' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >-> 12 probabilities</text><line x1='232' y1='117.0' x2='255' y2='117.0' stroke='#8a8984' stroke-width='1.5'/><path d='M262,117.0 l-8,-4.5 v9 z' fill='#8a8984'/><line x1='472' y1='117.0' x2='495' y2='117.0' stroke='#8a8984' stroke-width='1.5'/><path d='M502,117.0 l-8,-4.5 v9 z' fill='#8a8984'/><line x1='702' y1='117.0' x2='725' y2='117.0' stroke='#8a8984' stroke-width='1.5'/><path d='M732,117.0 l-8,-4.5 v9 z' fill='#8a8984'/><rect x='32' y='210' width='200' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='32' y='210' width='4' height='110' rx='2' fill='#52514e'/><text x='48' y='234' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >Radiology reports</text><text x='48' y='254' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >train set only, ~12 languages</text><text x='48' y='271' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >test studies have none</text><rect x='262' y='210' width='210' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='262' y='210' width='4' height='110' rx='2' fill='#eb6834'/><text x='278' y='234' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >Labels from text</text><text x='278' y='254' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >public LLM-read labels</text><text x='278' y='271' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >graded soft targets</text><text x='278' y='288' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >(only 58 hand labels exist)</text><rect x='502' y='210' width='200' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='502' y='210' width='4' height='110' rx='2' fill='#eb6834'/><text x='518' y='234' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >Train, select on gold-58</text><text x='518' y='254' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >BCE on soft labels</text><text x='518' y='271' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >keep best epoch by the</text><text x='518' y='288' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >58 hand-labelled studies</text><rect x='732' y='210' width='196' height='110' rx='10' fill='#ffffff' stroke='#e6e5e1' stroke-width='1.5'/><rect x='732' y='210' width='4' height='110' rx='2' fill='#2a78d6'/><text x='748' y='234' font-size='13.5' fill='#0b0b0b' text-anchor='start' font-weight='600' >Ensemble of 5</text><text x='748' y='254' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >probability average</text><text x='748' y='271' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >members picked by low</text><text x='748' y='288' font-size='12' fill='#52514e' text-anchor='start' font-weight='400' >correlation, on GPU</text><line x1='232' y1='265.0' x2='255' y2='265.0' stroke='#8a8984' stroke-width='1.5'/><path d='M262,265.0 l-8,-4.5 v9 z' fill='#8a8984'/><line x1='472' y1='265.0' x2='495' y2='265.0' stroke='#8a8984' stroke-width='1.5'/><path d='M502,265.0 l-8,-4.5 v9 z' fill='#8a8984'/><path d='M602,210 V180' stroke='#8a8984' stroke-width='1.5' fill='none' stroke-dasharray='4 4'/><text x='612' y='195.0' font-size='11.5' fill='#8a8984' text-anchor='start' font-weight='400' >trains</text><line x1='830' y1='172' x2='830' y2='203' stroke='#8a8984' stroke-width='1.5'/><path d='M830,210 l-4.5,-8 h9 z' fill='#8a8984'/></svg>